name: mobile-ci

on:
  push:
    paths:
      - 'mobile/**'
      - 'tools/check_apk_alignment.py'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'tools/check_apk_alignment.py'
      - '.github/workflows/mobile-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test -- --runInBand

  android-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run debug unit tests, lint, and assemble debug
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Verify 64-bit ELF alignment
        run: python ../../tools/check_apk_alignment.py app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification
          path: mobile/android/app/build/reports/
