pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
        maven {
            url "https://oss.sonatype.org/content/repositories/snapshots/"
            content {
                includeGroup("com.example.nothing")
            }
        }
    }
}

rootProject.name = 'havamania'
include ':app'
